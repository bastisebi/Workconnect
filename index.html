<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071522">
<title>WorkConnect</title>
<style>
:root{--bg:#071522;--panel:#0d1e30;--panel2:#10243a;--line:#1d354c;--text:#eef5fb;--muted:#91a5b9;--blue:#2f8cff;--green:#20c77a;--orange:#ffae42;--red:#ff6870}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#071522,#091b2b);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:82px}.top{padding:18px 18px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:800}.brand span{color:var(--blue)}.icon{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 12px}.page{padding:0 16px}.hero{background:linear-gradient(135deg,#123452,#0d2033);border:1px solid var(--line);border-radius:20px;padding:20px;margin:8px 0 16px}.hero h1{margin:0 0 6px;font-size:25px}.hero p,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;text-align:left;min-height:105px}.card .ico{font-size:25px}.card b{display:block;margin-top:8px}.card small{color:var(--muted)}.section-title{font-size:25px;margin:10px 0 14px}.toolbar{display:flex;gap:8px;margin-bottom:12px}.search,input,select,textarea{width:100%;background:#081827;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px;outline:none}.search:focus,input:focus,select:focus,textarea:focus{border-color:var(--blue)}textarea{min-height:90px;resize:vertical}.primary,.secondary,.danger{border-radius:11px;padding:10px 13px;border:1px solid var(--line);font-weight:700}.primary{background:var(--blue);border-color:#429aff}.secondary{background:var(--panel2)}.danger{background:#4a2228;border-color:#713238;color:#ffb0b3}.list,.detail{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:10px}.row{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;border-bottom:1px solid #183047;padding:12px 7px;text-align:left}.row:last-child{border-bottom:0}.avatar{width:42px;height:42px;border-radius:13px;background:#153552;display:grid;place-items:center;font-weight:800;flex:none}.row-main{flex:1;min-width:0}.row-main b{display:block}.row-main small{display:block;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{font-size:11px;padding:5px 8px;border-radius:20px;background:#17314a;color:#a9c9e9}.pill.green{background:#10452f;color:#72e0ac}.pill.orange{background:#4a351c;color:#ffc66d}.back{border:0;background:transparent;color:#8eb8df;padding:7px 0}.actions{display:flex;gap:8px;margin-top:14px}.actions>*{flex:1}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);background:#081725eF;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px env(safe-area-inset-bottom)}.nav{border:0;background:transparent;color:var(--muted);font-size:10px;padding:5px}.nav.active{color:white}.nav span{display:block;font-size:19px;margin-bottom:2px}.empty{padding:25px;text-align:center;color:var(--muted)}.notice{padding:12px;background:#102a40;border:1px solid #204662;border-radius:12px;color:#b9d5ea;margin:10px 0}.modalwrap{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:20}.modalwrap.open{display:flex}.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:#0b1b2b;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px}.modal h2{margin:0 0 15px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.cal{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden}.calhead{display:flex;align-items:center;justify-content:space-between;padding:12px}.viewtabs{display:flex;gap:6px;padding:0 12px 12px}.viewtab{flex:1;background:#091a2a;border:1px solid var(--line);border-radius:9px;padding:8px;color:var(--muted)}.viewtab.active{background:#176fd1;color:white}.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr)}.weekdays div{text-align:center;padding:8px;font-size:10px;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.day{min-height:78px;border-right:1px solid #193047;border-bottom:1px solid #193047;padding:5px;font-size:11px}.day em{font-style:normal;font-weight:800}.day.mutedday{opacity:.35}.day.today{box-shadow:inset 0 0 0 1px var(--blue)}.event{display:block;width:100%;margin-top:4px;padding:4px;border:0;border-radius:5px;background:#176fd1;text-align:left;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event.green{background:#146a48}.event.orange{background:#76501d}.weekview{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line)}.weekcol{border-right:1px solid #193047;min-width:0}.weekday{text-align:center;color:var(--muted);font-size:10px;padding:8px;border-bottom:1px solid var(--line)}.weekbody{min-height:480px;padding:5px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,#193047 48px)}.weekevent{display:block;width:100%;border:0;border-radius:7px;background:#176fd1;text-align:left;padding:5px;font-size:9px;margin-bottom:5px}.weekevent.green{background:#146a48}.weekevent.orange{background:#76501d}.dayview{display:grid;grid-template-columns:58px 1fr}.hours{font-size:10px;color:var(--muted)}.hour{height:48px;padding:5px;border-bottom:1px solid #193047}.dayevents{min-height:624px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,#193047 48px);padding:4px}.dayevent{width:100%;border:0;background:#176fd1;border-radius:8px;text-align:left;padding:9px;margin-bottom:6px}.permgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.perm{background:#081827;border:1px solid var(--line);padding:10px;border-radius:10px}.perm label{display:flex;justify-content:space-between;gap:8px;font-size:13px}.perm input{width:auto}.small{font-size:12px}.right{margin-left:auto}.hide{display:none!important}
@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.day{min-height:67px;padding:4px}.weekbody{min-height:430px}.brand{font-size:21px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalwrap" class="modalwrap" onclick="if(event.target===this)closeModal()"><div id="modal" class="modal"></div></div>
<script>
const KEY="workconnect_v2";
const seed={
customers:[
{id:1,name:"Max Mustermann",address:"Hauptstraße 12, 82467 Garmisch-Partenkirchen",phone:"08821 123456",mobile:"0171 1234567",email:"max@mustermann.de"},
{id:2,name:"Anna Beispiel",address:"Bahnhofstraße 8, 82467 Garmisch-Partenkirchen",phone:"08821 987654",mobile:"0176 9876543",email:"anna@beispiel.de"}],
orders:[
{id:1,no:"WC-1001",customer:1,title:"Küche Neubau",desc:"Neue Küche inklusive Montage.",status:"In Planung",employee:"Max Mustermann"},
{id:2,no:"4711",customer:2,title:"Arbeitsplatte",desc:"Arbeitsplatte ausmessen und montieren.",status:"Montage",employee:"Thomas Schneider"}],
complaints:[{id:1,no:"R-001",order:2,title:"Kante beschädigt",desc:"Beschädigung an der vorderen Kante.",status:"Offen"}],
events:[
{id:1,type:"Montage",date:"2026-09-08",time:"09:00",endTime:"12:00",order:1,customer:1,title:"Montage Küche",note:"Werkzeug und Silikon mitnehmen."},
{id:2,type:"Termin",date:"2026-09-09",time:"14:00",endTime:"15:00",order:2,customer:2,title:"Aufmaß Arbeitsplatte",note:"Kunde ist vor Ort."}],
employees:[
{name:"Max Mustermann",role:"Admin",enabled:true,permissions:{customers:true,orders:true,complaints:true,calendar:true,documents:true,delete:true}},
{name:"Thomas Schneider",role:"Monteur",enabled:true,permissions:{customers:false,orders:false,complaints:true,calendar:true,documents:true,delete:false}}]};
let state=load()||JSON.parse(JSON.stringify(seed));
state.route="home";state.calendarView=state.calendarView||"month";state.calendarDate=state.calendarDate||new Date(2026,8,8);state.currentUser=state.currentUser||"Max Mustermann";state.clocked=!!state.clocked;
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){localStorage.setItem(KEY,JSON.stringify({...state,route:undefined,calendarView:undefined,calendarDate:undefined}))}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function customer(id){return state.customers.find(x=>x.id==id)}
function order(id){return state.orders.find(x=>x.id==id)}
function emp(){return state.employees.find(x=>x.name===state.currentUser)||state.employees[0]}
function can(area,action="edit"){let e=emp();if(e.role==="Admin")return true;let p=e.permissions||{};if(action==="delete")return !!p.delete&&!!p[area];return !!p[area]}
function localISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function go(route){state.route=route;render()}
function render(){document.getElementById("app").innerHTML=page();document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.r===state.route))}
function page(){let body={home:home,customers:customers,orders:orders,calendar:calendar,more:more,complaints:complaints,admin:admin,time:time,documents:documents,chat:chat}[state.route]||home;return `<div class="app"><div class="top"><div class="brand">Work<span>Connect</span></div><button class="icon" onclick="showNotifications()">🔔</button></div><main class="page">${body()}</main><nav class="bottom"><button class="nav" data-r="home" onclick="go('home')"><span>⌂</span>Start</button><button class="nav" data-r="customers" onclick="go('customers')"><span>👥</span>Kunden</button><button class="nav" data-r="orders" onclick="go('orders')"><span>📋</span>Aufträge</button><button class="nav" data-r="calendar" onclick="go('calendar')"><span>📅</span>Kalender</button><button class="nav" data-r="more" onclick="go('more')"><span>☰</span>Mehr</button></nav></div>`}
function home(){return `<section class="hero"><h1>Willkommen bei WorkConnect</h1><p>Deine Arbeitsorganisation – Kunden, Aufträge, Termine, Montage, Reklamationen und Zeiterfassung an einem Ort.</p></section><div class="grid">
<div class="card" onclick="go('customers')"><div class="ico">👥</div><b>Kunden</b><small>${state.customers.length} Kunden</small></div>
<div class="card" onclick="go('orders')"><div class="ico">📋</div><b>Aufträge</b><small>${state.orders.length} Aufträge</small></div>
<div class="card" onclick="go('calendar')"><div class="ico">📅</div><b>Kalender</b><small>${state.events.length} Termine</small></div>
<div class="card" onclick="go('complaints')"><div class="ico">⚠️</div><b>Reklamationen</b><small>${state.complaints.filter(x=>x.status!=="Erledigt").length} offen</small></div>
<div class="card" onclick="go('time')"><div class="ico">⏱️</div><b>Zeiterfassung</b><small>${state.clocked?"Aktiv":"Nicht aktiv"}</small></div>
<div class="card" onclick="go('chat')"><div class="ico">💬</div><b>Chat</b><small>Arbeitskommunikation</small></div></div>`}
function customers(){return `<button class="back" onclick="go('home')">← Start</button><h1 class="section-title">Kunden</h1><div class="toolbar"><input class="search" placeholder="Name, Adresse, Telefon..." oninput="filterList('customers',this.value)">${can("customers")?`<button class="primary" onclick="newCustomer()">＋</button>`:""}</div><div id="list" class="list">${customerRows(state.customers)}</div>`}
function customerRows(a){return a.map(c=>`<button class="row" onclick="openCustomer(${c.id})"><div class="avatar">${esc(c.name.split(" ").map(x=>x[0]).join("").slice(0,2))}</div><div class="row-main"><b>${esc(c.name)}</b><small>${esc(c.address)}</small><small>${esc(c.mobile||c.phone)}</small></div><span>›</span></button>`).join("")||`<div class="empty">Keine Kunden.</div>`}
function filterList(type,q){let a=state[type].filter(x=>JSON.stringify(x).toLowerCase().includes(q.toLowerCase()));document.getElementById("list").innerHTML=type==="customers"?customerRows(a):orderRows(a)}
function openCustomer(id){let c=customer(id);let os=state.orders.filter(o=>o.customer==id);document.getElementById("app").innerHTML=baseNoNav(`<button class="back" onclick="go('customers')">← Kunden</button><h1 class="section-title">${esc(c.name)}</h1><div class="detail"><h3>Kundendaten</h3><p><b>Adresse</b><br>${esc(c.address)}</p><p><b>Telefon</b><br>${esc(c.phone||"-")}<br><b>Mobil</b><br>${esc(c.mobile||"-")}<br><b>E-Mail</b><br>${esc(c.email||"-")}</p>${can("customers")?`<div class="actions"><button class="primary" onclick="editCustomer(${id})">✏️ Bearbeiten</button>${can("customers","delete")?`<button class="danger" onclick="delCustomer(${id})">🗑️ Löschen</button>`:""}</div>`:""}</div><div class="detail" style="margin-top:12px"><h3>Aufträge dieses Kunden</h3>${orderRows(os)||`<div class="empty">Noch keine Aufträge.</div>`}</div>`)}
function newCustomer(){if(!can("customers"))return alert("Keine Berechtigung.");openModal(`<h2>Neuer Kunde</h2>${customerForm()}<div class="actions"><button class="secondary" onclick="closeModal()">Abbrechen</button><button class="primary" onclick="saveCustomer()">Speichern</button></div>`)}
function customerForm(c={}){return `<div class="field"><label>Name</label><input id="cn" value="${esc(c.name)}"></div><div class="field"><label>Adresse</label><input id="ca" value="${esc(c.address)}"></div><div class="field"><label>Telefon privat</label><input id="cp" value="${esc(c.phone)}"></div><div class="field"><label>Mobil</label><input id="cm" value="${esc(c.mobile)}"></div><div class="field"><label>E-Mail</label><input id="ce" type="email" value="${esc(c.email)}"></div>`}
function saveCustomer(id=null){let c=id?customer(id):{id:Date.now()};c.name=document.getElementById("cn").value.trim();c.address=document.getElementById("ca").value.trim();c.phone=document.getElementById("cp").value.trim();c.mobile=document.getElementById("cm").value.trim();c.email=document.getElementById("ce").value.trim();if(!c.name||!c.address)return alert("Name und Adresse sind Pflichtfelder.");if(!id)state.customers.push(c);save();closeModal();id?openCustomer(id):go("customers")}
function editCustomer(id){if(!can("customers"))return alert("Keine Berechtigung.");let c=customer(id);openModal(`<h2>Kunde bearbeiten</h2>${customerForm(c)}<div class="actions"><button class="secondary" onclick="closeModal()">Abbrechen</button><button class="primary" onclick="saveCustomer(${id})">Speichern</button></div>`)}
function delCustomer(id){if(!can("customers","delete"))return alert("Keine Löschberechtigung.");if(!confirm("Kunden wirklich löschen?"))return;state.customers=state.customers.filter(x=>x.id!=id);state.orders=state.orders.filter(x=>x.customer!=id);save();go("customers")}
function orders(){return `<button class="back" onclick="go('home')">← Start</button><div style="display:flex;justify-content:space-between;align-items:center"><h1 class="section-title">Aufträge</h1>${can("orders")?`<button class="primary" onclick="newOrder()">＋ Auftrag</button>`:""}</div><div class="toolbar"><input class="search" placeholder="Auftragsnummer, Kunde, Bezeichnung..." oninput="filterList('orders',this.value)"></div><div id="list" class="list">${orderRows(state.orders)}</div>`}
function orderRows(a){return a.map(o=>{let c=customer(o.customer);return `<button class="row" onclick="openOrder(${o.id})"><div class="avatar">#</div><div class="row-main"><b>#${esc(o.no)} · ${esc(o.title)}</b><small>${esc(c?.name||"Unbekannt")} · ${esc(c?.address||"")}</small></div><span class="pill ${o.status==="Montage"?"orange":o.status==="Abgeschlossen"?"green":""}">${esc(o.status)}</span></button>`}).join("")||`<div class="empty">Keine Aufträge.</div>`}
function orderForm(o={}){return `<div class="field"><label>1. Kunde</label><select id="oc">${state.customers.map(c=>`<option value="${c.id}" ${c.id==o.customer?"selected":""}>${esc(c.name)} – ${esc(c.address)}</option>`).join("")}</select></div><div class="field"><label>2. Auftragsnummer frei vergeben</label><input id="on" value="${esc(o.no)}" placeholder="z.B. 4711"></div><div class="field"><label>Bezeichnung</label><input id="ot" value="${esc(o.title)}"></div><div class="field"><label>Beschreibung</label><textarea id="od">${esc(o.desc)}</textarea></div><div class="field"><label>Status</label><select id="os">${["Neu","In Planung","In Bearbeitung","Montage","Abgeschlossen","Storniert"].map(x=>`<option ${x===o.status?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Mitarbeiter</label><select id="oe">${state.employees.map(e=>`<option ${e.name===o.employee?"selected":""}>${esc(e.name)}</option>`).join("")}</select></div>`}
function newOrder(){if(!can("orders"))return alert("Keine Berechtigung.");openModal(`<h2>Neuer Auftrag</h2>${orderForm()}<div class="actions"><button class="secondary" onclick="closeModal()">Abbrechen</button><button class="primary" onclick="saveOrder()">Speichern</button></div>`)}
function saveOrder(id=null){let o=id?order(id):{id:Date.now()};o.customer=+document.getElementById("oc").value;o.no=document.getElementById("on").value.trim();o.title=document.getElementById("ot").value.trim();o.desc=document.getElementById("od").value.trim();o.status=document.getElementById("os").value;o.employee=document.getElementById("oe").value;if(!o.no||!o.title)return alert("Auftragsnummer und Bezeichnung sind Pflichtfelder.");if(!id)state.orders.push(o);save();closeModal();id?openOrder(id):go("orders")}
function openOrder(id){let o=order(id),c=customer(o.customer),recs=state.complaints.filter(x=>x.order==id),evs=state.events.filter(x=>x.order==id);document.getElementById("app").innerHTML=baseNoNav(`<button class="back" onclick="go('orders')">← Aufträge</button><h1 class="section-title">Auftrag #${esc(o.no)}</h1><div class="detail"><h3>${esc(o.title)}</h3><p>${esc(o.desc)}</p><p><b>Kunde</b><br>${esc(c?.name||"")}<br>${esc(c?.address||"")}</p><p><span class="pill">${esc(o.status)}</span> · ${esc(o.employee)}</p>${can("orders")?`<div class="actions"><button class="primary" onclick="editOrder(${id})">✏️ Bearbeiten</button>${can("orders","delete")?`<button class="danger" onclick="delOrder(${id})">🗑️ Löschen</button>`:""}</div>`:""}</div><div class="detail" style="margin-top:12px"><h3>📅 Termine</h3>${evs.map(e=>`<button class="row" onclick="openEvent(${e.id})"><div class="row-main"><b>${esc(e.date)} · ${esc(e.time)}</b><small>${esc(e.title)}</small></div><span>›</span></button>`).join("")||`<div class="empty">Keine Termine.</div>`}</div><div class="detail" style="margin-top:12px"><h3>⚠️ Reklamationen</h3>${recs.map(x=>`<button class="row" onclick="openComplaint(${x.id})"><div class="row-main"><b>${esc(x.no)} · ${esc(x.title)}</b><small>${esc(x.status)}</small></div><span>›</span></button>`).join("")||`<div class="empty">Keine Reklamationen.</div>`}${can("complaints")?`<button class="primary" style="width:100%;margin-top:8px" onclick="newComplaint(${id})">＋ Reklamation</button>`:""}</div>`)}
function editOrder(id){if(!can("orders"))return alert("Keine Berechtigung.");openModal(`<h2>Auftrag bearbeiten</h2>${orderForm(order(id))}<div class="actions"><button class="secondary" onclick="closeModal()">Abbrechen</button><button class="primary" onclick="saveOrder(${id})">Speichern</button></div>`)}
function delOrder(id){if(!can("orders","delete"))return alert("Keine Löschberechtigung.");if(!confirm("Auftrag wirklich löschen?"))return;state.orders=state.orders.filter(x=>x.id!=id);state.events=state.events.filter(x=>x.order!=id);state.complaints=state.complaints.filter(x=>x.order!=id);save();go("orders")}
function calendar(){let d=state.calendarDate||new Date(),h=state.calendarView==="week"?calendarWeek(d):state.calendarView==="day"?calendarDay(d):calendarMonth(d);return h}
function calHeader(d,a){return `<button class="back" onclick="go('home')">← Start</button><div style="display:flex;justify-content:space-between;align-items:center"><h1 class="section-title">Kalender</h1><button class="primary" onclick="newEvent('${localISO(d)}')">＋ Termin</button></div><div class="cal"><div class="calhead"><button class="icon" onclick="calendarMove(-1)">‹</button><b>${d.toLocaleDateString("de-DE",{month:"long",year:"numeric"})}</b><div><button class="icon" onclick="calendarToday()">Heute</button><button class="icon" onclick="calendarMove(1)">›</button></div></div><div class="viewtabs"><button class="viewtab ${a==="month"?"active":""}" onclick="state.calendarView='month';render()">Monat</button><button class="viewtab ${a==="week"?"active":""}" onclick="state.calendarView='week';render()">Woche</button><button class="viewtab ${a==="day"?"active":""}" onclick="state.calendarView='day';render()">Tag</button></div>`}
function calendarMonth(d){let y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),start=(first.getDay()+6)%7,total=Math.ceil((start+last.getDate())/7)*7,cells="",names=["Mo","Di","Mi","Do","Fr","Sa","So"];for(let i=0;i<total;i++){let x=new Date(y,m,i-start+1),iso=localISO(x),ev=state.events.filter(e=>e.date===iso),today=iso===localISO(new Date());cells+=`<div class="day ${x.getMonth()===m?"":"mutedday"} ${today?"today":""}" onclick="newEvent('${iso}')"><em>${x.getDate()}</em>${ev.slice(0,3).map(e=>`<button class="event ${e.type==="Termin"?"green":"orange"}" onclick="event.stopPropagation();openEvent(${e.id})">${esc(e.time)} ${esc(e.title)}</button>`).join("")}${ev.length>3?`<small>+${ev.length-3}</small>`:""}</div>`}return `${calHeader(d,"month")}<div class="weekdays">${names.map(n=>`<div>${n}</div>`).join("")}</div><div class="days">${cells}</div></div>${calendarList()}`}
function startWeek(d){let x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(12);return x}
function calendarWeek(d){let s=startWeek(d),names=["Mo","Di","Mi","Do","Fr","Sa","So"],cols="";for(let i=0;i<7;i++){let x=new Date(s);x.setDate(s.getDate()+i),iso=localISO(x);cols+=`<div class="weekcol"><div class="weekday">${names[i]}<br><b>${x.getDate()}.</b></div><div class="weekbody" onclick="newEvent('${iso}')">${state.events.filter(e=>e.date===iso).map(e=>`<button class="weekevent ${e.type==="Termin"?"green":"orange"}" onclick="event.stopPropagation();openEvent(${e.id})"><b>${esc(e.time)}</b><br>${esc(e.title)}</button>`).join("")}</div></div>`}return `${calHeader(d,"week")}<div class="weekview">${cols}</div></div>${calendarList()}`}
function calendarDay(d){let iso=localISO(d),rows="";for(let h=7;h<=19;h++)rows+=`<div class="hour">${String(h).padStart(2,"0")}:00</div>`;return `${calHeader(d,"day")}<div class="dayview"><div class="hours">${rows}</div><div class="dayevents" onclick="newEvent('${iso}')">${state.events.filter(e=>e.date===iso).map(e=>`<button class="dayevent" onclick="event.stopPropagation();openEvent(${e.id})"><b>${esc(e.time)}${e.endTime?" – "+esc(e.endTime):""}</b><br>${esc(e.title)}</button>`).join("")}</div></div></div>${calendarList()}`}
function calendarList(){let a=state.events.slice().sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));return `<div class="detail" style="margin-top:12px"><h3>Termine & Montagen</h3>${a.map(e=>{let c=customer(e.customer),o=order(e.order);return `<button class="row" onclick="openEvent(${e.id})"><span>${e.type==="Montage"?"🔧":"📅"}</span><div class="row-main"><b>${esc(e.date)} · ${esc(e.time)}${e.endTime?"–"+esc(e.endTime):""}</b><small>${esc(e.title)}${o?" · Auftrag #"+esc(o.no):""}${c?" · "+esc(c.name):""}</small></div><span>›</span></button>`}).join("")||`<div class="empty">Keine Termine.</div>`}</div>`}
function calendarMove(n){let d=new Date(state.calendarDate);if(state.calendarView==="month")d.setMonth(d.getMonth()+n);else if(state.calendarView==="week")d.setDate(d.getDate()+7*n);else d.setDate(d.getDate()+n);state.calendarDate=d;render()}
function calendarToday(){state.calendarDate=new Date();render()}
function eventForm(e={}){return `<div class="field"><label>Art</label><select id="et"><option ${e.type!=="Termin"?"selected":""}>Montage</option><option ${e.type==="Termin"?"selected":""}>Termin</option></select></div><div class="field"><label>Datum</label><input id="ed" type="date" value="${esc(e.date||localISO(state.calendarDate))}"></div><div class="field"><label>Von</label><input id="eb" type="time" value="${esc(e.time||"09:00")}"></div><div class="field"><label>Bis</label><input id="ee" type="time" value="${esc(e.endTime||"10:00")}"></div><div class="field"><label>Auftrag</label><select id="eo"><option value="">Kein Auftrag</option>${state.orders.map(o=>`<option value="${o.id}" ${e.order==o.id?"selected":""}>#${esc(o.no)} – ${esc(o.title)}</option>`).join("")}</select></div><div class="field"><label>Kunde</label><select id="ec"><option value="">Kein Kunde</option>${state.customers.map(c=>`<option value="${c.id}" ${e.customer==c.id?"selected":""}>${esc(c.name)} – ${esc(c.address)}</option>`).join("")}</select></div><div class="field"><label>Titel</label><input id="ei" value="${esc(e.title||"Montage")}"></div><div class="field"><label>Notiz</label><textarea id="en">${esc(e.note||"")}</textarea></div>`}
function newEvent(date="",id=null){if(!can("calendar"))return alert("Keine Berechtigung.");let e=id?state.events.find(x=>x.id==id):{};openModal(`<h2>${id?"Termin bearbeiten":"Neuer Termin"}</h2>${eventForm({...e,date:date||e.date})}<div class="actions"><button class="secondary" onclick="closeModal()">Abbrechen</button><button class="primary" onclick="saveEvent(${id||"null"})">Speichern</button></div>`)}
function saveEvent(id){let e=id?state.events.find(x=>x.id==id):{id:Date.now()};Object.assign(e,{type:document.getElementById("et").value,date:document.getElementById("ed").value,time:document.getElementById("eb").value,endTime:document.getElementById("ee").value,order:+document.getElementById("eo").value||null,customer:+document.getElementById("ec").value||null,title:document.getElementById("ei").value.trim(),note:document.getElementById("en").value.trim()});if(!e.date||!e.time||!e.title)return alert("Datum, Uhrzeit und Titel sind Pflichtfelder.");if(e.endTime&&e.endTime<e.time)return alert("Endzeit muss nach der Startzeit liegen.");if(!id)state.events.push(e);save();closeModal();state.calendarDate=new Date(e.date+"T12:00:00");render()}
function openEvent(id){let e=state.events.find(x=>x.id==id),c=customer(e.customer),o=order(e.order);openModal(`<h2>📅 ${esc(e.title)}</h2><div class="detail"><p><b>${esc(e.date)} · ${esc(e.time)}${e.endTime?" – "+esc(e.endTime):""}</b></p><p>${esc(e.type)}</p>${c?`<p><b>Kunde:</b><br>${esc(c.name)}<br>${esc(c.address)}</p>`:""}${o?`<p><b>Auftrag:</b> #${esc(o.no)} · ${esc(o.title)}</p>`:""}${e.note?`<p><b>Notiz:</b><br>${esc(e.note)}</p>`:""}</div><div class="actions"><button class="primary" onclick="newEvent('',${id})">✏️ Bearbeiten</button><button class="danger" onclick="deleteEvent(${id})">🗑️ Löschen</button></div>`)}
function deleteEvent(id){if(!can("calendar","delete"))return alert("Keine Löschberechtigung.");if(confirm("Termin wirklich löschen?")){state.events=state.events.filter(x=>x.id!=id);save();closeModal();render()}}
function complaints(){return `<button class="back" onclick="go('home')">← Start</button><div style="display:flex;justify-content:space-between;align-items:center"><h1 class="section-title">Reklamationen</h1></div><div class="list">${state.complaints.map(x=>`<button class="row" onclick="openComplaint(${x.id})"><div class="avatar">⚠️</div><div class="row-main"><b>${esc(x.no)} · ${esc(x.title)}</b><small>Auftrag #${esc(order(x.order)?.no||"")} · ${esc(x.status)}</small></div><span>›</span></button>`).join("")||`<div class="empty">Keine Reklamationen.</div>`}</div>`}
function newComplaint(orderId){if(!can("complaints"))return alert("Keine Berechtigung.");openModal(`<h2>Neue Reklamation</h2><div class="field"><label>Reklamationsnummer</label><input id="rn" value="R-${String(state.complaints.length+1).padStart(3,"0")}"></div><div class="field"><label>Bezeichnung</label><input id="rt"></div><div class="field"><label>Beschreibung</label><textarea id="rd"></textarea></div><div class="actions"><button class="secondary" onclick="closeModal()">Abbrechen</button><button class="primary" onclick="saveComplaint(${orderId})">Speichern</button></div>`)}
function saveComplaint(orderId){state.complaints.push({id:Date.now(),no:document.getElementById("rn").value,title:document.getElementById("rt").value,desc:document.getElementById("rd").value,status:"Offen",order:orderId});save();closeModal();openOrder(orderId)}
function openComplaint(id){let x=state.complaints.find(c=>c.id==id),o=order(x.order);openModal(`<h2>⚠️ ${esc(x.no)}</h2><div class="detail"><h3>${esc(x.title)}</h3><p>${esc(x.desc)}</p><p>Status: <span class="pill">${esc(x.status)}</span></p><p>Auftrag: #${esc(o?.no||"")}</p></div>${can("complaints")?`<div class="actions"><button class="primary" onclick="editComplaint(${id})">✏️ Bearbeiten</button>${can("complaints","delete")?`<button class="danger" onclick="deleteComplaint(${id})">🗑️ Löschen</button>`:""}</div>`:""}`)}
function editComplaint(id){let x=state.complaints.find(c=>c.id==id);openModal(`<h2>Reklamation bearbeiten</h2><div class="field"><label>Nummer</label><input id="rn" value="${esc(x.no)}"></div><div class="field"><label>Bezeichnung</label><input id="rt" value="${esc(x.title)}"></div><div class="field"><label>Beschreibung</label><textarea id="rd">${esc(x.desc)}</textarea></div><div class="field"><label>Status</label><select id="rs">${["Offen","In Bearbeitung","Erledigt"].map(s=>`<option ${s===x.status?"selected":""}>${s}</option>`).join("")}</select></div><div class="actions"><button class="secondary" onclick="closeModal()">Abbrechen</button><button class="primary" onclick="saveComplaintEdit(${id})">Speichern</button></div>`)}
function saveComplaintEdit(id){let x=state.complaints.find(c=>c.id==id);x.no=document.getElementById("rn").value;x.title=document.getElementById("rt").value;x.desc=document.getElementById("rd").value;x.status=document.getElementById("rs").value;save();closeModal();openComplaint(id)}
function deleteComplaint(id){if(!can("complaints","delete"))return alert("Keine Löschberechtigung.");if(confirm("Reklamation löschen?")){state.complaints=state.complaints.filter(x=>x.id!=id);save();closeModal();go("complaints")}}
function time(){return `<button class="back" onclick="go('home')">← Start</button><h1 class="section-title">Zeiterfassung</h1><div class="hero"><h1>${state.clocked?"🟢 Eingestempelt":"⚪ Ausgestempelt"}</h1><p>Arbeitszeitübersicht und Start/Stop für den Prototyp.</p><button class="primary" onclick="state.clocked=!state.clocked;save();render()">${state.clocked?"Ausstempeln":"Einstempeln"}</button></div><div class="detail"><h3>Arbeitszeitübersicht</h3><p>Heute · ${state.clocked?"Arbeitszeit läuft":"Noch nicht gestartet"}</p><div class="notice">Die Admin-Rechte für Stempelbereiche können später je Mitarbeiter festgelegt werden.</div></div>`}
function documents(){return `<button class="back" onclick="go('home')">← Start</button><h1 class="section-title">Dokumente</h1><div class="detail"><h3>📄 Dokumente</h3><p class="muted">PDF, Bilder und weitere Dateitypen können in der nächsten Backend-Stufe hochgeladen und direkt Kunde/Auftrag zugeordnet werden.</p><input type="file" multiple accept=".pdf,image/*,.doc,.docx,.xls,.xlsx"></div>`}
function chat(){return `<button class="back" onclick="go('home')">← Start</button><h1 class="section-title">Chat</h1><div class="list"><div class="row"><div class="avatar">MM</div><div class="row-main"><b>Max Mustermann</b><small>Arbeitschat – ohne Statusbilder</small></div><span>›</span></div><div class="row"><div class="avatar">TS</div><div class="row-main"><b>Thomas Schneider</b><small>Montage / Aufträge</small></div><span>›</span></div></div>`}
function more(){return `<h1 class="section-title">Mehr</h1><div class="grid"><div class="card" onclick="go('admin')"><div class="ico">⚙️</div><b>Admin</b><small>Mitarbeiter & Rechte</small></div><div class="card" onclick="go('documents')"><div class="ico">📄</div><b>Dokumente</b><small>PDF & Dateien</small></div><div class="card" onclick="go('complaints')"><div class="ico">⚠️</div><b>Reklamationen</b><small>Bearbeiten</small></div><div class="card" onclick="go('time')"><div class="ico">⏱️</div><b>Arbeitszeiten</b><small>Start / Stop</small></div></div><div class="notice">💾 Testdaten werden auf diesem Gerät gespeichert.</div><button class="danger" style="width:100%" onclick="resetDemo()">↺ Demo-Daten zurücksetzen</button>`}
function admin(){return `<button class="back" onclick="go('more')">← Mehr</button><h1 class="section-title">Admin-Bereich</h1><div class="detail"><h3>👥 Mitarbeiter</h3>${state.employees.map((e,i)=>`<div class="row"><div class="avatar">${esc(e.name.split(" ").map(x=>x[0]).join("").slice(0,2))}</div><div class="row-main"><b>${esc(e.name)}</b><small>${esc(e.role)} · Benutzername: ${esc(e.name.split(" ")[0])}</small></div></div><button class="primary" style="width:100%;margin-bottom:8px" onclick="permissions(${i})">🔐 Rechte verwalten</button>`).join("")}</div><div class="detail" style="margin-top:12px"><h3>⏱️ Stempelbereiche</h3><p class="muted">Hier werden später die Bereiche pro Mitarbeiter freigegeben oder deaktiviert.</p></div><div class="detail" style="margin-top:12px"><h3>🔔 Benachrichtigungen</h3><p class="muted">Chat, Termine, Montagen und Reklamationen können individuell aktiviert werden. Arbeitszeiten-Modus kann Benachrichtigungen stummschalten.</p></div>`}
function permissions(i){let e=state.employees[i],p=e.permissions||{};openModal(`<h2>Rechte – ${esc(e.name)}</h2><div class="permgrid">${[["customers","Kunden bearbeiten"],["orders","Aufträge bearbeiten"],["complaints","Reklamationen bearbeiten"],["calendar","Kalender bearbeiten"],["documents","Dokumente verwalten"],["delete","Löschen erlauben"]].map(([k,l])=>`<div class="perm"><label>${l}<input type="checkbox" id="p_${k}" ${p[k]?"checked":""}></label></div>`).join("")}</div><div class="actions"><button class="secondary" onclick="closeModal()">Abbrechen</button><button class="primary" onclick="savePerm(${i})">Speichern</button></div>`)}
function savePerm(i){let e=state.employees[i];e.permissions={customers:document.getElementById("p_customers").checked,orders:document.getElementById("p_orders").checked,complaints:document.getElementById("p_complaints").checked,calendar:document.getElementById("p_calendar").checked,documents:document.getElementById("p_documents").checked,delete:document.getElementById("p_delete").checked};save();closeModal();render()}
function resetDemo(){if(confirm("Alle Teständerungen zurücksetzen?")){localStorage.removeItem(KEY);location.reload()}}
function baseNoNav(body){return `<div class="app"><div class="top"><div class="brand">Work<span>Connect</span></div></div><main class="page">${body}</main></div>`}
function openModal(x){document.getElementById("modal").innerHTML=x;document.getElementById("modalwrap").classList.add("open")}
function closeModal(){document.getElementById("modalwrap").classList.remove("open")}
function showNotifications(){openModal(`<h2>🔔 Benachrichtigungen</h2><div class="notice">Keine neuen Benachrichtigungen.</div><p class="muted">Im Admin-Bereich können die Benachrichtigungstypen später pro Mitarbeiter individuell geschaltet werden.</p><button class="primary" style="width:100%" onclick="closeModal()">Schließen</button>`)}
render();
</script>
</body>
</html>
